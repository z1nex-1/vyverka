categories:
  paper:
    title: Бумага для офисной техники
    okpd2: ["17.12.14", "17.23.14"]
    keywords: ["бумага"]
    exclude:
      - {pattern: "цветн|в клетку|в линейку|\\d+\\s*цвет", unless: "цветн|клетк|линейк", reason: "цветная или линованная бумага, в ТЗ — белая без разлиновки"}
    price_basis: pack           # цена сравнивается за пачку; при иной фасовке — пересчёт через листы
    pack_attr: sheets_per_pack
    identity: soft              # марка из ТЗ желательна, эквивалент допустим
  printer3d:
    title: 3D-принтеры
    okpd2: ["26.20.16.129", "28.99.12"]
    keywords: ["3d принтер", "3d-принтер"]
    price_basis: unit
    identity: strict            # модель указана в ТЗ — сравниваем только её
  reagents:
    title: Реактивы и белки
    okpd2: ["20.59.51", "20.59.52", "21.20"]
    keywords: ["рекомбинантный", "интерлейкин", "фактор роста"]
    # Предложение исключается, если в нём есть pattern, а в ТЗ нет unless (или есть when).
    exclude:
      - {pattern: "набор|иммуноферм|\\bифа\\b|elisa|\\bkit\\b|антител|определени|исследовани", reason: "набор для анализа или услуга, а не сам белок"}
      - {pattern: "\\bgmp\\b", unless: "gmp", reason: "класс GMP для клинического применения, в ТЗ — для исследовательских целей"}
      - {pattern: "e\\.?\\s?coli|кишечн", when: "\\bcho\\b", reason: "белок из E. coli, в ТЗ — из клеток CHO"}
    price_basis: amount         # цена за мкг, затем на фасовку из ТЗ
    pack_attr: amount
    identity: target            # совпадение белка и вида обязательно, производитель — любой
  generic:
    title: Прочие товары
    price_basis: unit
    identity: soft              # если в ТЗ модель с цифрами (P2423, 59A) — сверяется как strict
    exclude:
      - {pattern: "заправк|восстановлени|ремонт|замена|\\bуслуг|обслуживани|диагностик|разборк", unless: "заправк|восстановлени|ремонт|услуг|обслуживани", title_only: true, reason: "услуга (заправка, ремонт, обслуживание), а не поставка товара"}
      - {pattern: "ракел|фотобарабан|дозирующ\\w* лезв|вал заряда|магнитн\\w* вал|\\bчип для|запчаст|запасн\\w* част", unless: "ракел|фотобарабан|лезв|\\bвал\\b|\\bчип\\b|запчаст|запасн", title_only: true, reason: "запчасть к товару, а не сам товар"}
