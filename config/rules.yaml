# Правила обоснования. Меняются без правки кода.
method:
  min_offers: 3                 # не менее трёх цен (Приказ Минэкономразвития № 567, п. 3.20.1)
  cv_limit: 33                  # совокупность однородна при коэффициенте вариации не выше 33 % (п. 3.20)
  max_age_years: 3              # исполненные контракты за последние 3 года
  outlier: hint                 # hint: при V > 33 % подсказать крайнюю цену, решение за закупщиком (п. 3.20 Приказа № 567);
                                # iterative: исключать её автоматически, пока V > предела (вне методики, по положению заказчика)
  outlier_mad_k: 3.0            # предварительный фильтр: |x - медиана| > k * MAD
  outlier_mad_min_n: 6          # на малых выборках MAD неустойчив — только проверка CV
  max_outlier_share: 0.34       # не исключать больше трети предложений
  one_offer_per_supplier: true
  rounding: 2
  prefer_contracts: true        # реестр контрактов ЕИС — основной источник, каталоги — дополнительный

comparability:
  include_score: 0.6            # доля подтверждённых существенных характеристик для включения
  identity_weight: 0.35         # вес совпадения марки/модели, если они указаны в ТЗ
  allow_unknown: true           # неизвестная характеристика не исключает, но снижает оценку
  equivalent_share: 0.6         # другая модель допускается как эквивалент, если подтверждено ≥ 60 % характеристик
  at_least: [build_volume, build_volume_dual]   # габариты, где больше — не хуже
  peak_prefixes: [максимальн, наибольш]         # «максимальный нагрев 100 °C» = не менее 100 °C
  tolerance_pct: {supply: 10}                  # напряжение сети: допуск ±10 % (ГОСТ 32144)
  le_prefixes: [точность позиционирования, погрешность]   # меньше — лучше

