[project]
name = "vyverka"
version = "0.1.0"
description = "Обоснование начальной (максимальной) цены договора методом сопоставимых рыночных цен"
readme = "README.md"
authors = [
    { name = "z1nex-1" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vyverka = "vyverka:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
